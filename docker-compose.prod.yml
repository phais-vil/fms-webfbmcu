services:
  # Web Application Service (Next.js 16)
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fms_web_prod
    restart: always
    ports:
      - "127.0.0.1:3010:3010" # Bind strictly to localhost (Reverse Proxy will forward 80/443)
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-fms_admin}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-fms_prod}?schema=public
      - AUTH_SECRET=${AUTH_SECRET}
      - APP_URL=${APP_URL}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - fms_internal_network

  # Database Service (PostgreSQL 16) - Strictly isolated
  db:
    image: postgres:16-alpine
    container_name: fms_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fms_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-fms_prod}
    # SECURITY NOTE: Port 5432 is intentionally NOT published to host to block external scans/attacks
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fms_admin} -d ${POSTGRES_DB:-fms_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fms_internal_network

volumes:
  postgres_prod_data:
    driver: local

networks:
  fms_internal_network:
    driver: bridge
